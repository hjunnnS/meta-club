name: meta-club-g0-check
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: local_g0_only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  nakama:
    image: heroiclabs/nakama:3.27.1
    depends_on:
      db: {condition: service_healthy}
    cpus: 1
    mem_limit: 512m
    volumes: ["./nakama:/nakama/data/modules:ro"]
    ports: ["127.0.0.1:17350:7350"]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/nakama/nakama migrate up --database.address postgres:local_g0_only@db:5432/nakama && exec /nakama/nakama --name g0 --database.address postgres:local_g0_only@db:5432/nakama --runtime.js_entrypoint probe.js --logger.level WARN"]
  colyseus:
    image: node:22-alpine
    cpus: 1
    mem_limit: 512m
    volumes: [".:/check:ro"]
    working_dir: /check
    command: ["node", "colyseus.cjs"]
    ports: ["127.0.0.1:17351:7351"]
