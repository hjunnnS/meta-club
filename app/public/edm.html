<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
  /><title>EDM 클럽</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #100e18;
      color: #f4edff;
      font: 15px system-ui;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header,
    nav,
    aside {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.4rem 0.7rem;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0 auto 0 0;
    }
    a {
      color: #dbcaff;
    }
    button,
    select,
    input {
      font: inherit;
    }
    button,
    select {
      background: #322840;
      color: white;
      border: 1px solid #60566f;
      border-radius: 5px;
      padding: 0.22rem 0.5rem;
    }
    main {
      position: relative;
      flex: 1;
      min-height: 6rem;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #guide { background: #21192b; padding: .55rem .8rem; }
    #guide p { margin: .25rem 0 0; }
    #first-actions { display: flex; flex-wrap: wrap; align-items: start; gap: .5rem 1.1rem; }
    #first-actions .step { display: none; font-size: .85rem; color: #dfc9ff; margin-bottom: .25rem; }
    body:has(#guide:not([hidden])) #first-actions .step { display: block; }
    #train-hint { font-size: .85rem; }
    #orientation {
      display: none;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #orientation {
        display: block;
        text-align: center;
        background: #332445;
      }
    }
    [hidden] {
      display: none !important;
    }
    body:has(#shop-stop:not([hidden])) #guide {
      display: none;
    }
    body:has(#shop-stop:not([hidden])) iframe {
      pointer-events: none;
    }
    #shop-dialog {
      color: inherit;
      background: #201a29;
      border: 1px solid #665475;
      border-radius: 12px;
      width: min(32rem, 90vw);
      max-height: 85dvh;
      overflow: auto;
    }
    #shop-dialog::backdrop {
      background: #100e18aa;
    }
    #shop-dialog input {
      display: block;
      width: 100%;
      margin: 0.35rem 0;
    }
    #shop-dialog p,
    #shop-dialog li {
      line-height: 1.5;
    }
  button[data-dance][aria-pressed="true"]{font-weight:700;box-shadow:inset 0 -3px currentColor}
</style>
  <header>
    <h1>EDM 클럽</h1>
    <button id="show-guide" aria-expanded="false" aria-controls="guide first-actions">첫 방문 안내</button>
    <output id="zones"></output><output id="population">채널 배정 중…</output><button id="retry" hidden>다시 입장</button
    ><a href="/lobby">로비로 돌아가기</a>
  </header>
  <div id="orientation">가로로 돌리면 공간을 넓게 볼 수 있습니다.</div>
  <main>
    <iframe title="EDM 클럽 공간" hidden></iframe>
  </main>
  <section id="guide" aria-label="EDM 첫 방문 안내" hidden>
    <strong>EDM에서 처음 놀기</strong> <button id="dismiss">안내 닫기</button>
    <p>아래 버튼으로 바로 시작하세요. WASD로 걷고 마우스를 드래그해 둘러볼 수 있습니다.</p>
    <p id="guide-guest" hidden>춤·무드봉·기차는 <a href="/auth/signin?callbackUrl=%2Fclubs%2Fedm">회원 로그인</a> 후 이용할 수 있습니다.</p>
  </section>
  <nav aria-label="EDM 활동">
    <div id="first-actions">
      <div><span class="step">1. 음악 켜기</span><button id="music">음악 시작</button> <output id="track"></output></div>
      <div><span class="step">2. 춤 하나 고르기</span><span id="dance-options"></span></div>
      <div><span class="step">3. 춤추며 흔들기</span><button id="wand" aria-pressed="false">무드봉 들기</button></div>
      <div><span class="step">4. 중앙 플로어 기차 타기</span>
        <button id="train-start" hidden>중앙 플로어 기차 출발</button>
        <button id="train-join" hidden>기차 합류</button><button id="train-leave" hidden>기차 내리기</button>
        <span class="step" id="train-hint" aria-live="polite"></span>
      </div>
    </div>
    <button id="shop-open" hidden>EDM 상품</button>
    <button id="shop-stop" hidden>미리보기 종료</button>
    <button data-action="wave">인사</button><button data-action="idle">멈춤</button>
    <label><input id="other-wands" type="checkbox" checked>다른 손님 무드봉</label>
    <button id="seat">앉기 / 일어나기</button
    ><label><input id="fast-flash" type="checkbox">빠른 점멸 (0.1초)</label>
    <label
      >화질
      <select id="quality">
        <option value="auto">자동</option>
        <option value="high">높음</option>
        <option value="low">낮음</option>
      </select></label
    ><output id="info"></output>
  </nav>
  <details id="event-controls" hidden>
    <summary>무대 이벤트 미리보기</summary>
    <label>전광판 문구 <input id="event-message" maxlength="80" value="오늘의 주인공을 축하해요!" /></label>
    <button data-event="led">LED 전광판</button>
    <button data-event="laser">레이저 쇼</button><button data-event="phoenix">불사조 소환</button>
    <button data-event="stop">연출 중단</button>
  </details>
  <aside>
    <label>채널 <select id="channels"></select></label>
    <button id="switch">이동</button>
    <output id="notice" aria-live="polite"></output>
  </aside>
  <dialog id="shop-dialog" aria-labelledby="shop-title">
    <h2 id="shop-title">EDM 상품</h2>
    <p id="shop-price"></p>
    <ul id="shop-terms"></ul>
    <label>전광판 문구 <input id="shop-message" placeholder="축하 메시지를 입력하세요" /></label>
    <p id="shop-status" role="status"></p>
    <div id="shop-select">
      <button id="shop-preview">미리보기</button> <button id="shop-order">모의 구매 요청</button>
    </div>
    <div id="shop-checkout" hidden>
      <button data-result="awaiting_verification">모의 승인 요청</button>
      <button data-result="cancelled">주문 취소</button>
      <button data-result="declined">거절 시뮬레이션</button>
    </div>
    <button id="shop-new" hidden>새 주문</button> <button id="shop-close">닫기</button>
  </dialog>
  <script src="/clubs/edm/sdk.js"></script>
  <script type="module" src="/clubs/edm/client.js"></script>
</html>
