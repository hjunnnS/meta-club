<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
  /><title>EDM 클럽</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #100e18;
      color: #f4edff;
      font: 15px system-ui;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header,
    nav,
    aside {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.4rem 0.7rem;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0 auto 0 0;
    }
    a {
      color: #dbcaff;
    }
    button,
    select,
    input {
      font: inherit;
    }
    button,
    select {
      background: #322840;
      color: white;
      border: 1px solid #60566f;
      border-radius: 5px;
      padding: 0.22rem 0.5rem;
    }
    main {
      position: relative;
      flex: 1;
      min-height: 6rem;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #guide { background: #21192b; padding: .55rem .8rem; }
    #guide p { margin: .25rem 0 0; }
    #train-hint { font-size: .85rem; }
    #orientation {
      display: none;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #orientation {
        display: block;
        text-align: center;
        background: #332445;
      }
    }
    [hidden] {
      display: none !important;
    }
    body:has(#shop-stop:not([hidden])) #guide {
      display: none;
    }
    body:has(#shop-stop:not([hidden])) iframe {
      pointer-events: none;
    }
    #shop-dialog {
      color: inherit;
      background: #201a29;
      border: 1px solid #665475;
      border-radius: 12px;
      width: min(32rem, 90vw);
      max-height: 85dvh;
      overflow: auto;
    }
    #shop-dialog::backdrop {
      background: #100e18aa;
    }
    #shop-dialog input {
      display: block;
      width: 100%;
      margin: 0.35rem 0;
    }
    #shop-dialog p,
    #shop-dialog li {
      line-height: 1.5;
    }
    header, nav, aside { padding-inline: clamp(.6rem, 2vw, 1.6rem); }
    header { background: #110d20; }
    #guide { background: #181324; padding: .4rem clamp(.6rem, 2vw, 1.6rem); }
    #guide strong { font-size: .94rem; }
    #guide p { display: inline; margin-left: .5rem; }
    nav button, header button { border: 1px solid #514360; border-radius: 1rem; padding: .34rem .75rem; cursor: pointer; }
    #music { background: #b9f4e7; color: #101920; font-weight: 700; }
    #music.awaiting {
      position: absolute; z-index: 1; bottom: calc(100% + .85rem); left: 50%; transform: translateX(-50%);
      padding: .7rem 1.4rem; border: 2px solid #d6fff4; border-radius: 2rem;
      background: #9df4db; color: #102524; font-size: 1.05rem; box-shadow: 0 2px 12px #100d20;
    }
    #music.awaiting::before { content: "▶"; margin-right: .55rem; }
    body:has(#guide:not([hidden]), .extras[open]) #music.awaiting { position: static; transform: none; }
    #guide { position: absolute; left: .75rem; bottom: .75rem; max-width: min(32rem, 90%); border-radius: .5rem; }
    footer, #first-actions { display: flex; align-items: center; gap: .55rem; }
    footer { position: relative; justify-content: space-between; background: #110d20; padding: .25rem .75rem; }
    footer > nav { min-width: 0; overflow-x: auto; flex-wrap: nowrap; padding: .2rem 0; }
    #first-actions, footer summary { white-space: nowrap; }
    #track:not(:empty) { display:inline-block; max-width: 13ch; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
    .extra-panel { position: absolute; z-index: 2; right: .75rem; bottom: 100%; background:#21192b; max-height:60vh; overflow:auto; width:min(34rem,95vw); }
    details:not([open]) > .extra-panel { display:none; }
    .extras > summary { margin: .35rem clamp(.6rem, 2vw, 1.6rem); cursor: pointer; color: #d3bfdc; }
    #notice:not(:empty) { padding: .3rem 1rem; }
  button[data-dance][aria-pressed="true"]{font-weight:700;box-shadow:inset 0 -3px currentColor}
</style>
  <header>
    <h1>EDM 클럽</h1>
    <output id="performance" aria-live="off"></output>
    <span id="particle-tests" hidden aria-label="공연 효과 시험">
      <button data-strobe-preview="normal">평소 싸이키 시험 · 5초</button>
      <button data-strobe-preview="transition">큰 전환 싸이키 시험 · 7초</button>
      <button data-peripheral-preview="smoke">위로 솟는 연기 시험 · 6초</button>
      <button data-peripheral-preview="laser">가는 레이저 시험 · 4초</button>
      <button data-peripheral-preview="wash">넓은 조명·싸이키 시험 · 4초</button>
      <button data-event="fountain">분수 불꽃 시험 · 5초</button>
      <button data-event="confetti">종이조각 분출 시험</button>
    </span>
    <button id="show-guide" aria-expanded="false" aria-controls="guide first-actions">첫 방문 안내</button>
    <output id="population">채널 배정 중…</output><button id="retry" hidden>다시 입장</button
    ><a href="/lobby">로비로 돌아가기</a>
  </header>
  <div id="orientation">가로로 돌리면 공간을 넓게 볼 수 있습니다.</div>
  <main>
    <iframe title="EDM 클럽 공간" hidden></iframe>
  <section id="guide" aria-label="EDM 첫 방문 안내" hidden>
    <strong>EDM에서 처음 놀기</strong> <button id="dismiss">안내 닫기</button>
    <p>음악을 켜고 춤을 고르세요. 무드봉을 들거나 운행 중인 기차에 합류할 수 있습니다. WASD로 걷고 드래그로 둘러보세요. 오른쪽 1~8번 테이블 가까이에서 소파를 클릭하거나 앉기 버튼을 누르세요. 일어나기 버튼으로 통로에 나올 수 있습니다.</p>
    <p id="train-hint" aria-live="polite"></p>
    <p id="guide-guest" hidden>춤·무드봉·기차는 <a href="/auth/signin?callbackUrl=%2Fclubs%2Fedm">회원 로그인</a> 후 이용할 수 있습니다.</p>
  </section>
  </main>
  <footer>
  <nav aria-label="EDM 활동">
    <div id="first-actions">
      <div><button id="music">음악 시작</button> <output id="track"></output></div>
      <div><span id="dance-options"></span></div>
      <div><button id="wand" aria-pressed="false">무드봉 들기</button></div>
      <div><button id="seat" hidden>앉기</button></div>
      <div>
        <button id="train-start" hidden>중앙 플로어 기차 출발</button>
        <button id="train-join" hidden>기차 합류</button><button id="train-leave" hidden>기차 내리기</button>
      </div>
    </div>
  </nav>
  <details class="extras"><summary>더 보기</summary><div class="extra-panel"><nav aria-label="추가 활동">
    <output id="zones"></output><button id="shop-open" hidden>EDM 상품</button>
    <button id="shop-stop" hidden>미리보기 종료</button>
    <button data-action="wave">인사</button><button data-action="idle">멈춤</button>
    <label><input id="other-wands" type="checkbox" checked>다른 손님 무드봉</label>
    <label><input id="fast-flash" type="checkbox">빠른 점멸 (0.1초)</label>
    <label
      >화질
      <select id="quality">
        <option value="auto">자동</option>
        <option value="high">높음</option>
        <option value="low">낮음</option>
      </select></label
    ><output id="info"></output>
  </nav>
  <details id="event-controls" hidden>
    <summary>공연 미리보기 · 시험 회원</summary>
    <label>전광판 문구 <input id="event-message" maxlength="80" value="오늘의 주인공을 축하해요!" /></label>
    <button data-event="led">LED 전광판</button>
    <button data-event="laser">레이저 쇼</button><button data-event="phoenix">불사조</button>
    <button data-event="whale">대형 고래</button><button data-event="dragon">네온 용</button>
    <button data-event="jellyfish">우주 해파리</button><button data-event="butterflies">나비 군집</button>
    <button data-event="stop">연출 중단</button>
  </details>
  <aside>
    <label>채널 <select id="channels"></select></label>
    <button id="switch">이동</button>

  </aside>
  </div></details></footer>
  <output id="notice" aria-live="polite"></output>
  <dialog id="shop-dialog" aria-labelledby="shop-title">
    <h2 id="shop-title">EDM 상품</h2>
    <p id="shop-price"></p>
    <ul id="shop-terms"></ul>
    <label>전광판 문구 <input id="shop-message" placeholder="축하 메시지를 입력하세요" /></label>
    <p id="shop-status" role="status"></p>
    <div id="shop-select">
      <button id="shop-preview">미리보기</button> <button id="shop-order">모의 구매 요청</button>
    </div>
    <div id="shop-checkout" hidden>
      <button data-result="awaiting_verification">모의 승인 요청</button>
      <button data-result="cancelled">주문 취소</button>
      <button data-result="declined">거절 시뮬레이션</button>
    </div>
    <button id="shop-new" hidden>새 주문</button> <button id="shop-close">닫기</button>
  </dialog>
  <script src="/clubs/edm/sdk.js"></script>
  <script type="module" src="/clubs/edm/client.js"></script>
</html>
