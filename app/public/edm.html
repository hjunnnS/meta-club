<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
  /><title>EDM 클럽</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #100e18;
      color: #f4edff;
      font: 15px system-ui;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header,
    nav,
    aside {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.4rem 0.7rem;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0 auto 0 0;
    }
    a {
      color: #dbcaff;
    }
    button,
    select,
    input {
      font: inherit;
    }
    button,
    select {
      background: #322840;
      color: white;
      border: 1px solid #60566f;
      border-radius: 5px;
      padding: 0.22rem 0.5rem;
    }
    main {
      position: relative;
      flex: 1;
      min-height: 6rem;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #guide {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      max-width: 85%;
      background: #21192bee;
      padding: 0.6rem;
      border-radius: 0.5rem;
    }
    #orientation {
      display: none;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #orientation {
        display: block;
        text-align: center;
        background: #332445;
      }
    }
    [hidden] {
      display: none !important;
    }
    body:has(#shop-stop:not([hidden])) #guide {
      display: none;
    }
    body:has(#shop-stop:not([hidden])) iframe {
      pointer-events: none;
    }
    #shop-dialog {
      color: inherit;
      background: #201a29;
      border: 1px solid #665475;
      border-radius: 12px;
      width: min(32rem, 90vw);
      max-height: 85dvh;
      overflow: auto;
    }
    #shop-dialog::backdrop {
      background: #100e18aa;
    }
    #shop-dialog input {
      display: block;
      width: 100%;
      margin: 0.35rem 0;
    }
    #shop-dialog p,
    #shop-dialog li {
      line-height: 1.5;
    }
  button[data-dance][aria-pressed="true"]{font-weight:700;box-shadow:inset 0 -3px currentColor}
</style>
  <header>
    <h1>EDM 클럽</h1>
    <output id="zones"></output><output id="population">채널 배정 중…</output><button id="retry" hidden>다시 입장</button
    ><a href="/lobby">로비로 돌아가기</a>
  </header>
  <div id="orientation">가로로 돌리면 공간을 넓게 볼 수 있습니다.</div>
  <main>
    <iframe title="EDM 클럽 공간" hidden></iframe>
    <div id="guide" hidden>
      음악 시작을 누른 뒤 WASD·드래그 또는 이동 패드로 공간을 둘러보세요. 춤을 춰 보고 위의
      로비 링크로 퇴장하세요. <button id="dismiss">닫기</button>
    </div>
  </main>
  <nav>
    <button id="shop-open" hidden>EDM 상품</button>
    <button id="shop-stop" hidden>미리보기 종료</button>
    <button id="music">음악 시작</button><output id="track"></output
    ><span id="dance-options"></span><button data-action="wave">인사</button
    ><button data-action="idle">멈춤</button><button id="seat">앉기 / 일어나기</button
    ><label><input id="fast-flash" type="checkbox">빠른 점멸 (0.1초)</label>
    <label
      >화질
      <select id="quality">
        <option value="auto">자동</option>
        <option value="high">높음</option>
        <option value="low">낮음</option>
      </select></label
    ><output id="info"></output>
  </nav>
  <details id="event-controls" hidden>
    <summary>무대 이벤트 미리보기</summary>
    <label>전광판 문구 <input id="event-message" maxlength="80" value="오늘의 주인공을 축하해요!" /></label>
    <button data-event="led">LED 전광판</button>
    <button data-event="laser">레이저 쇼</button><button data-event="phoenix">불사조 소환</button>
    <button data-event="stop">연출 중단</button>
  </details>
  <aside>
    <label>채널 <select id="channels"></select></label>
    <button id="switch">이동</button>
    <output id="notice" aria-live="polite"></output>
  </aside>
  <dialog id="shop-dialog" aria-labelledby="shop-title">
    <h2 id="shop-title">EDM 상품</h2>
    <p id="shop-price"></p>
    <ul id="shop-terms"></ul>
    <label>전광판 문구 <input id="shop-message" placeholder="축하 메시지를 입력하세요" /></label>
    <p id="shop-status" role="status"></p>
    <div id="shop-select">
      <button id="shop-preview">미리보기</button> <button id="shop-order">모의 구매 요청</button>
    </div>
    <div id="shop-checkout" hidden>
      <button data-result="awaiting_verification">모의 승인 요청</button>
      <button data-result="cancelled">주문 취소</button>
      <button data-result="declined">거절 시뮬레이션</button>
    </div>
    <button id="shop-new" hidden>새 주문</button> <button id="shop-close">닫기</button>
  </dialog>
  <script src="/clubs/edm/sdk.js"></script>
  <script type="module" src="/clubs/edm/client.js"></script>
</html>
